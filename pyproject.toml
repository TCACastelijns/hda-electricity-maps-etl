[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hda-electricity-maps-etl"
version = "0.1.0"
description = "Bronze-Silver-Gold ETL pipeline for Electricity Maps France electricity flows and mix"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.20,<2",
  "deltalake>=0.25,<1",
  "pyarrow>=18,<22",
  "requests>=2.32,<3",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
hda-etl = "hda_etl.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RET", "PL", "D"]
ignore = ["D100", "D104", "D203", "D213", "D401", "D101", "D102", "D103"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
